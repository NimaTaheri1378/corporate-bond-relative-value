version: 1
created_by: patch_corpbond_rv_step02.py
created_utc: '2026-05-28T19:23:52.111357+00:00'
notes:
- Exact table names selected after Step 01 account-level WRDS schema discovery.
- Runtime scripts default to JSON contracts to avoid relying on PyYAML being installed.
- Raw WRDS outputs remain under data/raw and are ignored by git.
