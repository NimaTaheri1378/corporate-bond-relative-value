[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corp-bond-rv"
version = "0.1.0"
description = "WRDS corporate bond issuer-curve relative-value research platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Research"}]
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "pyyaml",
    "polars",
    "sqlalchemy",
    "wrds",
    "psycopg2-binary",
    "statsmodels",
    "linearmodels",
    "scikit-learn",
    "plotly",
]

[project.optional-dependencies]
ml = ["lightgbm", "xgboost", "optuna"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "kaleido"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
